
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Checkout de Pagamento</title>
</head>
<body>

    <h1>Finalizar Compra</h1>

    <h2 align="center">Dados pessoais</h2>

    <form>
        <label for="nome">Nome completo:</label><br>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="cpf">CPF:</label><br>
        <input type="text" id="cpf" name="cpf" required><br><br>

        <h2>Endereço</h2>

        <label for="cep">CEP:</label><br>
        <input type="text" id="cep" name="cep" required><br><br>

        <label for="endereco">Endereço:</label><br>
        <input type="text" id="endereco" name="endereco" required><br><br>

        <label for="numero">Número:</label><br>
        <input type="text" id="numero" name="numero" required><br><br>

        <h2>Pagamento</h2>

        <label for="pagamento">Forma de pagamento:</label><br>
        <select id="pagamento" name="pagamento">
            <option value="pix">Pix</option>
            <option value="credito">Cartão de crédito</option>
            <option value="debito">Cartão de débito</option>
            <option value="boleto">Boleto</option>
        </select><br><br>

        <h2>Resumo do pedido</h2>

        <p>Produto: Teclado Gamer</p>
        <p>Quantidade: 1</p>
        <p>Valor: R$ 199,90</p>
        <p>Frete: Grátis</p>
        <h3>Total: R$ 199,90</h3>

      <a href="final.html">  <button>Finalizar compra</button></a>
    </form>

</body>
</html>
