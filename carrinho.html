
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Carrinho de compras</title>
</head>
<body>

    <h1>Carrinho de compras</h1>

    <!-- Botão para voltar ao catálogo -->
    <a href="catalogo.html">
        <img align="center" src="img/voltar.png" alt="Voltar ao catálogo">
    </a>

    <br><br>

    <!-- Tabela do carrinho -->
    <table>
        <tr>
            <th>Imagem</th>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Subtotal</th>
        </tr>

        <tr>
            <td>
                <img src="img/iphone-pequeno.png" alt="iPhone">
            </td>
            <td>Iphone 17 Pro Max 256GB - Prateado</td>
            <td>2 un.</td>
            <td>R$ 16.999,80</td>
        </tr>

        <tr>
            <td>
                <img src="img/samsung-pequeno.png" alt="Galaxy">
            </td>
            <td>Galaxy S26 Ultra 5G,512GB,12GB RAM</td>
            <td>1 un.</td>
            <td>R$ 7.899,90</td>
        </tr>

        <tr>
            <td colspan="3">
               <h2><Strong>Total</Strong></h2>
            </td>
            <td>
                <h2>R$ 24.899,70</h2>
                <br>
                <a href="checkout.html"><img src="img/ir_para_pagamento.png" alt=""></a>
            </td>
        </tr>
    </table>

    

    

</body>
</html>
